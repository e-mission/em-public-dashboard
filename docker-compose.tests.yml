version: "3"
services:
  notebook-server:
    image: em-pub-dash-dev/viz-scripts
    build:
      context: viz_scripts
      dockerfile: tests/Dockerfile.test
      args:
        SERVER_IMAGE_TAG: ${SERVER_IMAGE_TAG}
    depends_on:
      db:
        condition: service_healthy
      db-restore:
        condition: service_completed_successfully
    environment:
      - DB_HOST=db
      - WEB_SERVER_HOST=0.0.0.0
      - CRON_MODE=
      - STUDY_CONFIG=stage-program
    networks:
      - emission
    volumes:
      - ./viz_scripts:/usr/src/app/saved-notebooks
  # No named volume, so tests always start from an empty database and never share the dev volume
  db:
    image: mongo:8.0.4
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 2s
      retries: 30
    networks:
       - emission
  db-restore:
    image: mongo:8.0.4
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./viz_scripts/tests/data/openpath_prod_stage_program.tar.gz:/dump.tar.gz:ro
    command: bash -c "mkdir -p /tmp/restore && tar xzf /dump.tar.gz -C /tmp/restore && mongorestore --host db --drop /tmp/restore/dump"
    networks:
      - emission

networks:
  emission:
